name: Build Android Dev APK (EAS Local)

on:
  workflow_dispatch: # Hanya berjalan saat tombol "Run workflow" ditekan secara manual di GitHub

jobs:
  build:
    name: Build Android Development APK
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 3. Setup Python 3.10 (Chaquopy Host Requirement)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 6. Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 7. Install Dependencies
        run: npm ci

      - name: 8. Run EAS Local Build (Android Development APK)
        run: |
          eas build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output ./clipping-development.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: '1'

      - name: 9. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipping-development-apk
          path: mobile/clipping-development.apk
          retention-days: 14
